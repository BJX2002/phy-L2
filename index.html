<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sun, Earth & Moon - Primary Science Simulation</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior: none;
            position: fixed;
            inset: 0;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: block;
            touch-action: none;
        }
        #canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui-container {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            left: max(20px, env(safe-area-inset-left));
            width: 320px;
            max-width: calc(100vw - 40px - env(safe-area-inset-left) - env(safe-area-inset-right));
            max-height: calc(100dvh - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            box-sizing: border-box;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            background: rgba(15, 20, 30, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }
        h1 {
            font-size: 1.2rem;
            margin: 0;
            color: #4da6ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        #language-toggle {
            flex: 0 0 auto;
            min-width: 74px;
            padding: 6px 10px;
            font-size: 0.75rem;
        }
        p.subtitle {
            font-size: 0.85rem;
            color: #aaaaaa;
            margin-top: 0;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .sim-actions {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
        }
        #sim-toggle,
        #reset-sim {
            width: 100%;
            font-size: 0.95rem;
            font-weight: bold;
        }
        #reset-sim {
            min-width: 92px;
            flex: 0 0 auto;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            min-height: 36px;
            cursor: pointer;
            accent-color: #4da6ff;
            touch-action: pan-x;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background: #2a3b5c;
            color: white;
            border: 1px solid #4da6ff;
            padding: 8px 12px;
            min-height: 44px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            flex: 1;
            transition: all 0.2s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        @media (hover: hover) and (pointer: fine) {
            button:hover {
                background: #4da6ff;
                color: #000;
            }
        }
        button.active {
            background: #4da6ff;
            color: #000;
            font-weight: bold;
        }
        #info-panel {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .stat-value {
            font-family: monospace;
            color: #ffd700;
            font-size: 0.95rem;
        }
        #celestial-info {
            position: absolute;
            right: max(20px, env(safe-area-inset-right));
            top: max(20px, env(safe-area-inset-top));
            width: min(420px, calc(100vw - 40px));
            min-width: 340px;
            min-height: 150px;
            max-width: calc(100vw - 40px);
            max-height: calc(100dvh - 40px);
            box-sizing: border-box;
            background: rgba(12, 18, 30, 0.9);
            border: 1px solid rgba(77, 166, 255, 0.45);
            border-radius: 10px;
            padding: 22px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            overflow: auto;
            resize: both;
        }
        #celestial-info.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        #celestial-info.dragging {
            transition: none;
        }
        #celestial-info::after {
            content: "";
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 14px;
            height: 14px;
            border-right: 2px solid rgba(77, 166, 255, 0.7);
            border-bottom: 2px solid rgba(77, 166, 255, 0.7);
            pointer-events: none;
        }
        .info-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            cursor: move;
            touch-action: none;
        }
        #celestial-info h2 {
            margin: 0;
            font-size: 1.35rem;
            color: #ffd36a;
            letter-spacing: 0;
        }
        #info-close {
            flex: 0 0 auto;
            min-width: 36px;
            min-height: 36px;
            padding: 0;
            line-height: 1;
        }
        #celestial-info ul {
            margin: 0;
            padding-left: 22px;
            color: #e6eef8;
            font-size: 1.12rem;
            line-height: 1.55;
        }
        #celestial-info li + li {
            margin-top: 6px;
        }
        .instruction {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            pointer-events: none;
            color: #ddd;
            max-width: calc(100vw - 32px);
            box-sizing: border-box;
            text-align: center;
            white-space: nowrap;
        }
        @media (pointer: coarse) {
            #ui-container {
                background: rgba(15, 20, 30, 0.9);
            }
            .instruction {
                font-size: 0.8rem;
            }
        }
        @media (max-width: 820px) {
            #ui-container {
                top: max(12px, env(safe-area-inset-top));
                left: max(12px, env(safe-area-inset-left));
                width: min(300px, calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)));
                max-height: calc(100dvh - 76px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
                padding: 16px;
            }
            p.subtitle {
                margin-bottom: 14px;
            }
            .control-group {
                margin-bottom: 12px;
            }
            #info-panel {
                margin-top: 14px;
                padding-top: 12px;
            }
            #celestial-info {
                left: max(12px, env(safe-area-inset-left));
                right: max(12px, env(safe-area-inset-right));
                top: auto;
                bottom: max(52px, calc(env(safe-area-inset-bottom) + 52px));
                width: auto;
                min-width: 0;
                max-width: none;
                max-height: calc(100dvh - 120px);
                resize: vertical;
            }
            .instruction {
                bottom: max(10px, env(safe-area-inset-bottom));
            }
        }
        @media (max-height: 720px) and (orientation: landscape) {
            #ui-container {
                width: 300px;
                max-height: calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
                padding: 14px 16px;
            }
            h1 {
                font-size: 1.05rem;
                margin-bottom: 6px;
            }
            p.subtitle {
                font-size: 0.78rem;
                margin-bottom: 10px;
            }
            .control-group {
                margin-bottom: 8px;
            }
            #info-panel {
                margin-top: 9px;
                padding-top: 8px;
            }
            .instruction {
                left: auto;
                right: max(12px, env(safe-area-inset-right));
                transform: none;
                max-width: calc(100vw - 340px);
            }
            #celestial-info {
                right: max(12px, env(safe-area-inset-right));
                top: auto;
                bottom: max(64px, calc(env(safe-area-inset-bottom) + 64px));
                width: 360px;
                min-width: 300px;
            }
        }
    </style>
    <!-- Import Three.js via ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-container">
        <div class="panel-header">
            <h1 data-i18n="title">Celestial Mechanics</h1>
            <button id="language-toggle" type="button">繁體中文</button>
        </div>
        <p class="subtitle" data-i18n="subtitle">A teaching scale model of the Sun, Earth, and Moon. Sizes are exaggerated to fit the screen.</p>

        <div class="control-group">
            <div class="sim-actions">
                <button id="sim-toggle" type="button" data-i18n="startButton">Start</button>
                <button id="reset-sim" type="button" data-i18n="resetButton">Reset</button>
            </div>
        </div>
        
        <div class="control-group">
            <label data-i18n="speedLabel">Simulation Speed</label>
            <input type="range" id="speed-slider" min="0" max="10" step="0.1" value="1">
            <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #888;">
                <span data-i18n="paused">Paused</span>
                <span data-i18n="fast">Fast</span>
            </div>
        </div>

        <div class="control-group">
            <label data-i18n="cameraLabel">Camera Focus</label>
            <div class="btn-group">
                <button id="cam-system" class="active" data-i18n="solarSystem">Solar System</button>
                <button id="cam-earth" data-i18n="followEarth">Follow Earth</button>
            </div>
        </div>

        <div class="control-group">
            <label data-i18n="togglesLabel">Angles & Toggles</label>
            <div class="btn-group">
                <button id="toggle-axis" class="active" data-i18n="showAxis">Show Earth's Axis</button>
                <button id="toggle-orbits" class="active" data-i18n="showOrbits">Show Orbits</button>
            </div>
        </div>

        <div id="info-panel">
            <div class="stat-row">
                <span data-i18n="daysPassed">Days Passed:</span>
                <span id="days-counter" class="stat-value">0.0</span>
            </div>
            <div class="stat-row">
                <span data-i18n="yearsPassed">Years Passed:</span>
                <span id="years-counter" class="stat-value">0.00</span>
            </div>
        </div>
    </div>

    <div class="instruction" data-i18n="instruction">
        Mouse: Left Click to Rotate | Right Click to Pan | Scroll to Zoom
    </div>

    <div id="celestial-info" aria-live="polite" aria-hidden="true">
        <div class="info-header">
            <h2 id="celestial-info-title"></h2>
            <button id="info-close" type="button" aria-label="Close">X</button>
        </div>
        <ul id="celestial-info-list"></ul>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration & Constants (Teaching Scale) ---
        // True scale is impossible for a single screen view.
        // E.g., Sun is 109x wider than Earth. Distance is 11,700x Earth's width.
        const CONFIG = {
            sunRadius: 12,
            earthRadius: 4,
            moonRadius: 1.2,
            earthOrbitRadius: 70,
            moonOrbitRadius: 15,
            // Time Constants
            earthYearDays: 365.25,
            moonOrbitDays: 27.3,
            earthDayRotation: 1,
            // Angles (Radians)
            earthAxialTilt: 23.5 * (Math.PI / 180),
            moonOrbitalTilt: 5.14 * (Math.PI / 180) 
        };

        // --- Scene Setup ---
        const container = document.getElementById('canvas-container');
        const prefersTouchInput = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
        document.body.classList.toggle('touch-device', prefersTouchInput);
        const scene = new THREE.Scene();

        const makeCanvasTexture = (canvas) => {
            const texture = new THREE.CanvasTexture(canvas);
            texture.encoding = THREE.sRGBEncoding;
            texture.anisotropy = 8;
            return texture;
        };

        const createSunTexture = (size = 512) => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const base = ctx.createRadialGradient(size * 0.34, size * 0.28, size * 0.03, size * 0.5, size * 0.5, size * 0.72);
            base.addColorStop(0, '#fff7a8');
            base.addColorStop(0.28, '#ffd35a');
            base.addColorStop(0.62, '#f4741f');
            base.addColorStop(1, '#8f2608');
            ctx.fillStyle = base;
            ctx.fillRect(0, 0, size, size);

            ctx.globalAlpha = 0.28;
            for (let i = 0; i < 180; i++) {
                const y = Math.random() * size;
                const h = 4 + Math.random() * 18;
                const hue = 25 + Math.random() * 35;
                ctx.fillStyle = `hsl(${hue}, 100%, ${48 + Math.random() * 24}%)`;
                ctx.beginPath();
                ctx.ellipse(size * Math.random(), y, size * (0.08 + Math.random() * 0.22), h, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.globalAlpha = 0.36;
            ctx.strokeStyle = '#fff19b';
            ctx.lineWidth = 2;
            for (let i = 0; i < 34; i++) {
                const y = Math.random() * size;
                ctx.beginPath();
                ctx.moveTo(0, y);
                for (let x = 0; x <= size; x += 32) {
                    ctx.lineTo(x, y + Math.sin(x * 0.035 + i) * (5 + Math.random() * 4));
                }
                ctx.stroke();
            }

            ctx.globalAlpha = 1;
            return makeCanvasTexture(canvas);
        };

        const createEarthTexture = (size = 1024) => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size / 2;
            const ctx = canvas.getContext('2d');
            const h = canvas.height;

            const ocean = ctx.createLinearGradient(0, 0, 0, h);
            ocean.addColorStop(0, '#0b275d');
            ocean.addColorStop(0.5, '#176fbd');
            ocean.addColorStop(1, '#071c4d');
            ctx.fillStyle = ocean;
            ctx.fillRect(0, 0, size, h);

            const drawBlob = (cx, cy, rx, ry, color, points = 18) => {
                ctx.fillStyle = color;
                ctx.beginPath();
                for (let i = 0; i <= points; i++) {
                    const a = (i / points) * Math.PI * 2;
                    const wobble = 0.78 + Math.sin(i * 2.2 + cx) * 0.12 + Math.random() * 0.22;
                    const x = cx + Math.cos(a) * rx * wobble;
                    const y = cy + Math.sin(a) * ry * wobble;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
            };

            const land = [
                [0.18, 0.30, 0.10, 0.16, '#356d35'], [0.24, 0.62, 0.075, 0.20, '#2f7c3a'],
                [0.48, 0.34, 0.18, 0.12, '#65783d'], [0.53, 0.57, 0.07, 0.16, '#9a7f42'],
                [0.63, 0.38, 0.14, 0.10, '#4f7d3f'], [0.77, 0.42, 0.08, 0.12, '#446f39'],
                [0.81, 0.73, 0.09, 0.08, '#8b733c'], [0.03, 0.36, 0.10, 0.12, '#496c37'],
                [0.92, 0.23, 0.07, 0.07, '#6c6f3a']
            ];
            land.forEach(([cx, cy, rx, ry, color]) => drawBlob(cx * size, cy * h, rx * size, ry * h, color));

            ctx.globalAlpha = 0.24;
            ctx.fillStyle = '#c7a55a';
            for (let i = 0; i < 70; i++) {
                drawBlob(Math.random() * size, h * (0.18 + Math.random() * 0.68), size * 0.012, h * 0.018, '#d5bd72', 9);
            }
            ctx.globalAlpha = 1;

            const iceTop = ctx.createLinearGradient(0, 0, 0, h * 0.16);
            iceTop.addColorStop(0, '#f7fbff');
            iceTop.addColorStop(1, 'rgba(247,251,255,0)');
            ctx.fillStyle = iceTop;
            ctx.fillRect(0, 0, size, h * 0.18);
            const iceBottom = ctx.createLinearGradient(0, h, 0, h * 0.82);
            iceBottom.addColorStop(0, '#f7fbff');
            iceBottom.addColorStop(1, 'rgba(247,251,255,0)');
            ctx.fillStyle = iceBottom;
            ctx.fillRect(0, h * 0.82, size, h * 0.18);

            ctx.strokeStyle = 'rgba(255,255,255,0.16)';
            ctx.lineWidth = 1;
            for (let i = 1; i < 12; i++) {
                const y = (h / 12) * i;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(size, y);
                ctx.stroke();
            }
            for (let i = 1; i < 24; i++) {
                const x = (size / 24) * i;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
                ctx.stroke();
            }

            return makeCanvasTexture(canvas);
        };

        const createCloudTexture = (size = 1024) => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size / 2;
            const ctx = canvas.getContext('2d');
            const h = canvas.height;
            ctx.clearRect(0, 0, size, h);
            ctx.fillStyle = 'rgba(255,255,255,0.52)';
            for (let i = 0; i < 135; i++) {
                ctx.beginPath();
                ctx.ellipse(Math.random() * size, h * (0.1 + Math.random() * 0.8), size * (0.012 + Math.random() * 0.035), h * (0.008 + Math.random() * 0.025), Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }
            return makeCanvasTexture(canvas);
        };
        
        // Add Starry Background
        const starsGeometry = new THREE.BufferGeometry();
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8 });
        const starsVertices = [];
        for (let i = 0; i < 3000; i++) {
            const x = (Math.random() - 0.5) * 600;
            const y = (Math.random() - 0.5) * 600;
            const z = (Math.random() - 0.5) * 600;
            starsVertices.push(x, y, z);
        }
        starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // Camera Setup
        const initialWidth = container.clientWidth || window.innerWidth;
        const initialHeight = container.clientHeight || window.innerHeight;
        const camera = new THREE.PerspectiveCamera(45, initialWidth / initialHeight, 0.1, 1000);
        const setSystemCameraPosition = (width, height) => {
            if (width / height < 0.9) {
                camera.position.set(0, 120, 235);
            } else {
                camera.position.set(0, 80, 120);
            }
        };
        setSystemCameraPosition(initialWidth, initialHeight);

        // Renderer Setup
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: 'high-performance'
        });
        renderer.setSize(initialWidth, initialHeight, false);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, prefersTouchInput ? 1.5 : 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        // Important for good lighting
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = prefersTouchInput ? 0.7 : 1;
        controls.zoomSpeed = prefersTouchInput ? 0.85 : 1;
        controls.panSpeed = prefersTouchInput ? 0.7 : 1;
        controls.minDistance = 18;
        controls.maxDistance = 400;

        // --- Celestial Bodies ---

        // 1. The Sun
        const sunGroup = new THREE.Group();
        scene.add(sunGroup);

        const sunGeo = new THREE.SphereGeometry(CONFIG.sunRadius, 96, 96);
        const sunTexture = createSunTexture();
        const sunMat = new THREE.MeshStandardMaterial({
            map: sunTexture,
            emissive: 0xff8a00,
            emissiveMap: sunTexture,
            emissiveIntensity: 0.75,
            roughness: 0.7,
            bumpMap: sunTexture,
            bumpScale: 0.55
        });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        sunMesh.layers.enable(1);
        sunGroup.add(sunMesh);

        // Sun Glow Effect
        const glowGeo = new THREE.SphereGeometry(CONFIG.sunRadius * 1.28, 64, 64);
        const glowMat = new THREE.MeshBasicMaterial({ 
            color: 0xffaa00, 
            transparent: true, 
            opacity: 0.25,
            blending: THREE.AdditiveBlending
        });
        const sunGlow = new THREE.Mesh(glowGeo, glowMat);
        sunGroup.add(sunGlow);

        const coronaGeo = new THREE.SphereGeometry(CONFIG.sunRadius * 1.65, 64, 64);
        const coronaMat = new THREE.MeshBasicMaterial({
            color: 0xff6a00,
            transparent: true,
            opacity: 0.08,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const sunCorona = new THREE.Mesh(coronaGeo, coronaMat);
        sunGroup.add(sunCorona);

        // Sun Light Source (Point light originating from the sun)
        const sunLight = new THREE.PointLight(0xffffff, 2.5, 500);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = prefersTouchInput ? 1024 : 2048;
        sunLight.shadow.mapSize.height = prefersTouchInput ? 1024 : 2048;
        sunGroup.add(sunLight);

        const sunSurfaceLight = new THREE.DirectionalLight(0xfff0c0, 0.7);
        sunSurfaceLight.position.set(-30, 25, 40);
        sunSurfaceLight.layers.set(1);
        scene.add(sunSurfaceLight);
        camera.layers.enable(1);

        // Ambient Light (dim, to see the dark sides slightly)
        const ambientLight = new THREE.AmbientLight(0x222233, 0.6);
        scene.add(ambientLight);

        // 2. Earth System
        // We use a nested structure:
        // earthOrbitPivot (centered at sun, handles yearly rotation)
        // -> earthContainer (positioned at orbit radius, handles moon orbit)
        //   -> earthMesh (handles daily rotation and axial tilt)
        
        const earthOrbitPivot = new THREE.Group();
        scene.add(earthOrbitPivot);

        const earthContainer = new THREE.Group();
        earthContainer.position.x = CONFIG.earthOrbitRadius;
        earthOrbitPivot.add(earthContainer);

        // Earth Mesh with procedural land, ocean, ice, and clouds.
        const earthGeo = new THREE.SphereGeometry(CONFIG.earthRadius, 96, 96);
        const earthTexture = createEarthTexture();
        const earthMat = new THREE.MeshStandardMaterial({ 
            map: earthTexture,
            roughness: 0.58,
            metalness: 0.02
        });
        const earthMesh = new THREE.Mesh(earthGeo, earthMat);
        earthMesh.castShadow = true;
        earthMesh.receiveShadow = true;
        earthMesh.userData.infoKey = 'earth';

        const cloudGeo = new THREE.SphereGeometry(CONFIG.earthRadius * 1.025, 96, 96);
        const cloudMat = new THREE.MeshStandardMaterial({
            map: createCloudTexture(),
            transparent: true,
            opacity: 0.34,
            roughness: 0.8,
            depthWrite: false
        });
        const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
        cloudMesh.userData.infoKey = 'earth';

        const meridianPoints = [];
        for (let i = 0; i <= 96; i++) {
            const a = -Math.PI / 2 + (i / 96) * Math.PI;
            meridianPoints.push(new THREE.Vector3(
                Math.cos(a) * CONFIG.earthRadius * 1.045,
                Math.sin(a) * CONFIG.earthRadius * 1.045,
                0
            ));
        }
        const meridianLine = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(meridianPoints),
            new THREE.LineBasicMaterial({ color: 0xf5f7ff, transparent: true, opacity: 0.7 })
        );
        earthMesh.add(meridianLine);
        
        // Apply Axial Tilt to Earth
        const earthTiltGroup = new THREE.Group();
        earthTiltGroup.rotation.z = CONFIG.earthAxialTilt; 
        earthTiltGroup.add(earthMesh);
        earthTiltGroup.add(cloudMesh);
        earthContainer.add(earthTiltGroup);

        // Add visual Axis Line
        const axisGeo = new THREE.CylinderGeometry(0.1, 0.1, CONFIG.earthRadius * 3, 8);
        const axisMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const axisMesh = new THREE.Mesh(axisGeo, axisMat);
        earthTiltGroup.add(axisMesh); // Axis rotates with tilt, but not daily rotation

        // 3. Moon System
        const moonOrbitPivot = new THREE.Group();
        // Moon's orbit is tilted relative to Earth's orbit (ecliptic)
        moonOrbitPivot.rotation.x = CONFIG.moonOrbitalTilt;
        earthContainer.add(moonOrbitPivot);

        const moonGeo = new THREE.SphereGeometry(CONFIG.moonRadius, 32, 32);
        const moonMat = new THREE.MeshStandardMaterial({ 
            color: 0xaaaaaa,
            roughness: 0.8,
            metalness: 0.0
        });
        const moonMesh = new THREE.Mesh(moonGeo, moonMat);
        moonMesh.position.x = CONFIG.moonOrbitRadius;
        moonMesh.castShadow = true;
        moonMesh.receiveShadow = true;
        moonMesh.userData.infoKey = 'moon';
        moonOrbitPivot.add(moonMesh);

        // --- Orbit Paths (Visual Lines) ---
        const createOrbitLine = (radius, color = 0x445566) => {
            const curve = new THREE.EllipseCurve(
                0, 0,            // ax, aY
                radius, radius,  // xRadius, yRadius
                0, 2 * Math.PI,  // aStartAngle, aEndAngle
                false,           // aClockwise
                0                // aRotation
            );
            const points = curve.getPoints(100);
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.5 });
            const line = new THREE.Line(geometry, material);
            line.rotation.x = Math.PI / 2; // Lay flat
            return line;
        };

        const earthOrbitLine = createOrbitLine(CONFIG.earthOrbitRadius, 0x5588aa);
        scene.add(earthOrbitLine);

        const moonOrbitLine = createOrbitLine(CONFIG.moonOrbitRadius, 0x666666);
        // Apply moon's orbital tilt to its drawn path as well
        const moonOrbitLineContainer = new THREE.Group();
        moonOrbitLineContainer.rotation.x = CONFIG.moonOrbitalTilt;
        moonOrbitLineContainer.add(moonOrbitLine);
        earthContainer.add(moonOrbitLineContainer);

        // --- State Variables ---
        let simTime = 0; // Represents "Days"
        let isSimulationRunning = false;
        let hasSimulationStarted = false;
        let isEarthFocus = false;
        let selectedInfoKey = null;
        let infoDragState = null;
        const earthFocusOffset = new THREE.Vector3(22, 14, 30);
        const earthWorldPos = new THREE.Vector3();
        const desiredCameraPos = new THREE.Vector3();
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const pointerStart = new THREE.Vector2();
        const clickableObjects = [earthMesh, cloudMesh, moonMesh];
        
        // UI Elements
        const simToggle = document.getElementById('sim-toggle');
        const resetSim = document.getElementById('reset-sim');
        const speedSlider = document.getElementById('speed-slider');
        const daysCounter = document.getElementById('days-counter');
        const yearsCounter = document.getElementById('years-counter');
        const languageToggle = document.getElementById('language-toggle');
        const celestialInfo = document.getElementById('celestial-info');
        const celestialInfoTitle = document.getElementById('celestial-info-title');
        const celestialInfoList = document.getElementById('celestial-info-list');
        const infoClose = document.getElementById('info-close');

        const translations = {
            en: {
                documentTitle: 'Sun, Earth & Moon - Simulation',
                title: 'Celestial Mechanics',
                subtitle: 'A teaching scale model of the Sun, Earth, and Moon. Sizes are exaggerated to fit the screen.',
                startButton: 'Start',
                pauseButton: 'Pause',
                resumeButton: 'Resume',
                resetButton: 'Reset',
                speedLabel: 'Simulation Speed',
                paused: 'Paused',
                fast: 'Fast',
                cameraLabel: 'Camera Focus',
                solarSystem: 'Solar System',
                followEarth: 'Follow Earth',
                togglesLabel: 'Angles & Toggles',
                showAxis: "Show Earth's Axis",
                showOrbits: 'Show Orbits',
                daysPassed: 'Days Passed:',
                yearsPassed: 'Years Passed:',
                instruction: 'Mouse: Drag to Rotate | Scroll to Zoom | Click Earth or Moon for Facts',
                instructionTouch: 'Touch: Drag to Rotate | Pinch to Zoom | Tap Earth or Moon for Facts',
                earthInfoTitle: 'Earth',
                moonInfoTitle: 'Moon',
                earthAxialTiltFact: "Earth's axis is tilted 23.5 degrees.",
                moonRotationFact: 'The Moon takes about 27 days to rotate once.',
                moonOrbitFact: 'The Moon takes about 27 days to orbit Earth once.',
                closeLabel: 'Close',
                toggleButton: '繁體中文',
                htmlLang: 'en'
            },
            zh: {
                documentTitle: '太陽、地球與月球 - 模擬',
                title: '天體運行',
                subtitle: '太陽、地球和月球的教學比例模型。大小和距離已誇張處理，方便在畫面中觀察。',
                startButton: '開始',
                pauseButton: '暫停',
                resumeButton: '繼續',
                resetButton: '歸零',
                speedLabel: '模擬速度',
                paused: '暫停',
                fast: '快速',
                cameraLabel: '鏡頭焦點',
                solarSystem: '太陽系',
                followEarth: '跟隨地球',
                togglesLabel: '角度與顯示',
                showAxis: '顯示地軸',
                showOrbits: '顯示軌道',
                daysPassed: '經過日數：',
                yearsPassed: '經過年數：',
                instruction: '滑鼠：拖曳旋轉 | 滾輪縮放 | 點擊地球或月球看資料',
                instructionTouch: '觸控：單指旋轉 | 雙指縮放 | 點按地球或月球看資料',
                earthInfoTitle: '地球',
                moonInfoTitle: '月球',
                earthAxialTiltFact: '地球地軸傾斜 23.5 度。',
                moonRotationFact: '月球自轉一周約 27 天。',
                moonOrbitFact: '月球繞地球公轉一周約 27 天。',
                closeLabel: '關閉',
                toggleButton: 'English',
                htmlLang: 'zh-Hant'
            }
        };
        let currentLanguage = 'en';

        const infoContent = {
            earth: {
                title: 'earthInfoTitle',
                facts: ['earthAxialTiltFact']
            },
            moon: {
                title: 'moonInfoTitle',
                facts: ['moonRotationFact', 'moonOrbitFact']
            }
        };

        function updateRunButton() {
            const copy = translations[currentLanguage];
            const labelKey = !hasSimulationStarted
                ? 'startButton'
                : isSimulationRunning
                    ? 'pauseButton'
                    : 'resumeButton';
            simToggle.textContent = copy[labelKey];
            simToggle.classList.toggle('active', isSimulationRunning);
        }

        function updateCounters() {
            daysCounter.innerText = simTime.toFixed(1);
            yearsCounter.innerText = (simTime / CONFIG.earthYearDays).toFixed(2);
        }

        function resetSimulation() {
            simTime = 0;
            isSimulationRunning = false;
            hasSimulationStarted = false;
            updateRunButton();
            updateCounters();
        }

        function showCelestialInfo(infoKey) {
            const content = infoContent[infoKey];
            if (!content) return;
            selectedInfoKey = infoKey;
            const copy = translations[currentLanguage];
            celestialInfoTitle.textContent = copy[content.title];
            celestialInfoList.innerHTML = '';
            content.facts.forEach((factKey) => {
                const item = document.createElement('li');
                item.textContent = copy[factKey];
                celestialInfoList.appendChild(item);
            });
            celestialInfo.classList.add('visible');
            celestialInfo.setAttribute('aria-hidden', 'false');
        }

        function hideCelestialInfo() {
            selectedInfoKey = null;
            celestialInfo.classList.remove('visible');
            celestialInfo.setAttribute('aria-hidden', 'true');
        }

        function clampInfoPanel(left, top) {
            const rect = celestialInfo.getBoundingClientRect();
            const safeLeft = Math.max(8, Math.min(left, window.innerWidth - rect.width - 8));
            const safeTop = Math.max(8, Math.min(top, window.innerHeight - rect.height - 8));
            celestialInfo.style.left = `${safeLeft}px`;
            celestialInfo.style.top = `${safeTop}px`;
            celestialInfo.style.right = 'auto';
            celestialInfo.style.bottom = 'auto';
        }

        function applyLanguage(language) {
            currentLanguage = language;
            const copy = translations[currentLanguage];
            document.documentElement.lang = copy.htmlLang;
            document.title = copy.documentTitle;
            document.querySelectorAll('[data-i18n]').forEach((element) => {
                const key = element.dataset.i18n;
                element.textContent = key === 'instruction' && prefersTouchInput
                    ? copy.instructionTouch
                    : copy[key];
            });
            languageToggle.textContent = copy.toggleButton;
            infoClose.setAttribute('aria-label', copy.closeLabel);
            updateRunButton();
            if (selectedInfoKey) {
                showCelestialInfo(selectedInfoKey);
            }
        }

        // --- Interaction Logic ---
        
        window.addEventListener('resize', onWindowResize, false);
        window.visualViewport?.addEventListener('resize', onWindowResize);
        function onWindowResize() {
            const width = container.clientWidth || window.innerWidth;
            const height = container.clientHeight || window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, prefersTouchInput ? 1.5 : 2));
            renderer.setSize(width, height, false);
            if (!isEarthFocus) {
                setSystemCameraPosition(width, height);
                controls.target.set(0, 0, 0);
            }
        }

        document.getElementById('cam-system').addEventListener('click', (e) => {
            isEarthFocus = false;
            e.target.classList.add('active');
            document.getElementById('cam-earth').classList.remove('active');
            // Animate camera back to center
            setSystemCameraPosition(container.clientWidth || window.innerWidth, container.clientHeight || window.innerHeight);
            controls.target.set(0,0,0);
        });

        document.getElementById('cam-earth').addEventListener('click', (e) => {
            isEarthFocus = true;
            e.target.classList.add('active');
            document.getElementById('cam-system').classList.remove('active');
            earthMesh.getWorldPosition(earthWorldPos);
            earthFocusOffset.copy(camera.position).sub(earthWorldPos);
            const currentDistance = earthFocusOffset.length();
            if (currentDistance < 18 || currentDistance > 72) {
                earthFocusOffset.set(22, 14, 30);
            }
        });

        document.getElementById('toggle-axis').addEventListener('click', (e) => {
            axisMesh.visible = !axisMesh.visible;
            e.target.classList.toggle('active');
        });

        document.getElementById('toggle-orbits').addEventListener('click', (e) => {
            earthOrbitLine.visible = !earthOrbitLine.visible;
            moonOrbitLineContainer.visible = !moonOrbitLineContainer.visible;
            e.target.classList.toggle('active');
        });

        simToggle.addEventListener('click', () => {
            hasSimulationStarted = true;
            isSimulationRunning = !isSimulationRunning;
            updateRunButton();
        });

        resetSim.addEventListener('click', resetSimulation);

        languageToggle.addEventListener('click', () => {
            applyLanguage(currentLanguage === 'en' ? 'zh' : 'en');
        });

        infoClose.addEventListener('click', hideCelestialInfo);

        celestialInfo.querySelector('.info-header').addEventListener('pointerdown', (event) => {
            if (event.target === infoClose) return;
            const rect = celestialInfo.getBoundingClientRect();
            infoDragState = {
                startX: event.clientX,
                startY: event.clientY,
                left: rect.left,
                top: rect.top
            };
            celestialInfo.classList.add('dragging');
            celestialInfo.setPointerCapture(event.pointerId);
            event.preventDefault();
        });

        celestialInfo.addEventListener('pointermove', (event) => {
            if (!infoDragState) return;
            clampInfoPanel(
                infoDragState.left + event.clientX - infoDragState.startX,
                infoDragState.top + event.clientY - infoDragState.startY
            );
        });

        celestialInfo.addEventListener('pointerup', (event) => {
            if (!infoDragState) return;
            infoDragState = null;
            celestialInfo.classList.remove('dragging');
            celestialInfo.releasePointerCapture(event.pointerId);
        });

        celestialInfo.addEventListener('pointercancel', () => {
            infoDragState = null;
            celestialInfo.classList.remove('dragging');
        });

        renderer.domElement.addEventListener('pointerdown', (event) => {
            pointerStart.set(event.clientX, event.clientY);
        });

        renderer.domElement.addEventListener('pointerup', (event) => {
            const dragDistance = pointerStart.distanceTo(new THREE.Vector2(event.clientX, event.clientY));
            if (dragDistance > 8) return;

            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);

            const hits = raycaster.intersectObjects(clickableObjects, false);
            if (hits.length > 0) {
                showCelestialInfo(hits[0].object.userData.infoKey);
            }
        });

        applyLanguage(currentLanguage);

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const timeScale = parseFloat(speedSlider.value);
            
            // Advance simulation time
            // timeScale of 1 means 1 day passes every second in real time
            if (isSimulationRunning) {
                simTime += delta * timeScale;
            }

            // --- Update Rotations and Positions based on specific ratios ---
            
            // 1. Earth's Orbit around Sun (Year)
            // 360 degrees (2 PI) / 365.25 days = radians per day
            earthOrbitPivot.rotation.y = simTime * ((2 * Math.PI) / CONFIG.earthYearDays);
            sunMesh.rotation.y = simTime * 0.18;
            sunGlow.rotation.y = -simTime * 0.08;
            sunCorona.rotation.y = simTime * 0.04;

            // 2. Earth's Rotation on Axis (Day)
            // 360 degrees (2 PI) / 1 day
            earthMesh.rotation.y = simTime * ((2 * Math.PI) / CONFIG.earthDayRotation);
            cloudMesh.rotation.y = earthMesh.rotation.y * 1.08;

            // 3. Moon's Orbit around Earth (Month)
            moonOrbitPivot.rotation.y = simTime * ((2 * Math.PI) / CONFIG.moonOrbitDays);

            // 4. Moon's Synchronous Rotation (Always shows same face to Earth)
            moonMesh.rotation.y = moonOrbitPivot.rotation.y;

            // --- Camera Following Logic ---
            if (isEarthFocus) {
                earthMesh.getWorldPosition(earthWorldPos);
                desiredCameraPos.copy(earthWorldPos).add(earthFocusOffset);
                controls.target.lerp(earthWorldPos, 0.14);
                camera.position.lerp(desiredCameraPos, 0.14);
            }

            // --- Update UI ---
            updateCounters();

            // Render
            controls.update();
            if (isEarthFocus) {
                earthFocusOffset.copy(camera.position).sub(controls.target);
            }
            renderer.render(scene, camera);
        }

        // Start the loop after window load
        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
